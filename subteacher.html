<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>বিষয় শিক্ষক নম্বর এন্ট্রি - ইবনে তাইমিয়া স্কুল এন্ড কলেজ</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; font-family: 'Hind Siliguri', 'Poppins', sans-serif; }
    body {
      margin: 0; padding: 14px 10px; min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #1e293b;
    }
    .container {
      max-width: 820px; margin: 0 auto; background: #fff;
      border-radius: 16px; padding: 20px 18px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .header {
      background: linear-gradient(135deg, #4338ca, #6d28d9, #be185d);
      color: #fff; padding: 18px 20px; border-radius: 12px;
      text-align: center; margin-bottom: 18px;
    }
    .header h1 { margin: 0; font-size: 22px; }
    .header p { margin: 4px 0 0; font-size: 14px; color: #e0e7ff; }

    .filter-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 12px; background: #f8fafc; padding: 16px;
      border-radius: 12px; border: 1.5px solid #cbd5e1; margin-bottom: 16px;
    }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 13px; font-weight: 700; color: #334155; }
    .field input, .field select {
      padding: 10px 12px; border: 2px solid #cbd5e1; border-radius: 8px;
      font-size: 15px; font-weight: 600; background: #fff; color: #0f172a;
    }
    .field input:focus, .field select:focus {
      border-color: #4f46e5; outline: none; box-shadow: 0 0 0 3px rgba(79,70,229,0.2);
    }

    .btn {
      width: 100%; padding: 13px 18px; border: none; border-radius: 10px;
      font-size: 16px; font-weight: 700; cursor: pointer; color: #fff;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-load { background: linear-gradient(135deg, #2563eb, #4f46e5); }
    .btn-save {
      background: linear-gradient(135deg, #059669, #10b981);
      margin-top: 16px; position: sticky; bottom: 10px;
      box-shadow: 0 8px 20px rgba(16,185,129,0.4);
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .status-box {
      padding: 12px 15px; border-radius: 10px; margin: 14px 0;
      font-weight: 600; font-size: 14px; display: none;
    }
    .status-ok { background: #ecfdf5; color: #065f46; border: 1.5px solid #6ee7b7; }
    .status-err { background: #fef2f2; color: #991b1b; border: 1.5px solid #fca5a5; }

    .table-wrap { overflow-x: auto; margin-top: 14px; border-radius: 10px; border: 1.5px solid #cbd5e1; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border: 1px solid #cbd5e1; padding: 8px 6px; text-align: center; }
    th { background: #1e1b4b; color: #fff; font-size: 13.5px; }
    tbody tr:nth-child(even) { background: #f8fafc; }
    td.name-col { text-align: left; padding-left: 10px; font-weight: 600; min-width: 140px; }
    td input[type="number"] {
      width: 72px; padding: 8px 6px; border: 2px solid #cbd5e1;
      border-radius: 8px; text-align: center; font-size: 15px; font-weight: 700;
    }
    td input[type="number"]:focus { border-color: #4f46e5; outline: none; background: #eef2ff; }
    .badge-tot { background: #e0e7ff; color: #3730a3; padding: 4px 8px; border-radius: 6px; font-weight: 700; }
    .badge-gr { background: #fef3c7; color: #b45309; padding: 4px 8px; border-radius: 6px; font-weight: 700; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>ইবনে তাইমিয়া স্কুল এন্ড কলেজ</h1>
    <p>বিষয় শিক্ষক নম্বর এন্ট্রি পোর্টাল (অনলাইন সিঙ্ক)</p>
  </div>

  <div class="filter-grid">
    <div class="field">
      <label>শ্রেণি (Class)</label>
      <select id="tClass">
        <option value="Six">Six</option>
        <option value="Seven">Seven</option>
        <option value="Eight" selected>Eight</option>
      </select>
    </div>
    <div class="field">
      <label>শাখা (Section)</label>
      <select id="tSection">
        <option value="A" selected>A</option>
        <option value="B">B</option>
        <option value="C">C</option>
      </select>
    </div>
    <div class="field">
      <label>শিফট (Shift)</label>
      <input type="text" id="tShift" value="Joba">
    </div>
    <div class="field">
      <label>সাল (Year)</label>
      <input type="text" id="tYear" value="2026">
    </div>
    <div class="field" style="grid-column: 1 / -1;">
      <label>আপনার বিষয় নির্বাচন করুন</label>
      <select id="tSubject">
        <option value="b1">বাংলা-১ (পূর্ণমান ১০০)</option>
        <option value="b2">বাংলা-২ (পূর্ণমান ৫০)</option>
        <option value="e1">ইংরেজি-১ (পূর্ণমান ১০০)</option>
        <option value="e2">ইংরেজি-২ (পূর্ণমান ১০০)</option>
        <option value="math">গণিত (পূর্ণমান ১০০)</option>
        <option value="rel">ধর্ম শিক্ষা (পূর্ণমান ১০০)</option>
        <option value="arab">আরবী (পূর্ণমান ১০০)</option>
        <option value="bgs">BGS (পূর্ণমান ১০০)</option>
        <option value="sci">বিজ্ঞান (পূর্ণমান ১০০)</option>
        <option value="ict">ICT (পূর্ণমান ৫০)</option>
        <option value="agri">Agriculture / Home Science (পূর্ণমান ৫০)</option>
        <option value="art">Art & Craft (পূর্ণমান ৫০)</option>
        <option value="spoken">Spoken English (পূর্ণমান ২৫)</option>
        <option value="moral">Moral Activities (পূর্ণমান ৫০)</option>
        <option value="drill">ড্রীল (পূর্ণমান ২৫)</option>
      </select>
    </div>
  </div>

  <button class="btn btn-load" id="loadBtn" onclick="loadStudents()">
    <i class="fa-solid fa-cloud-arrow-down"></i> শিক্ষার্থী তালিকা লোড করুন
  </button>

  <div id="statusBox" class="status-box"></div>

  <div id="marksSection" style="display:none;">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:60px;">রোল</th>
            <th style="text-align:left; padding-left:10px;">শিক্ষার্থীর নাম</th>
            <th>ET</th>
            <th>Tu</th>
            <th>Tot</th>
            <th>Gr</th>
          </tr>
        </thead>
        <tbody id="marksBody"></tbody>
      </table>
    </div>

    <button class="btn btn-save" id="saveBtn" onclick="saveMarks()">
      <i class="fa-solid fa-cloud-arrow-up"></i> নম্বর সেভ করুন (Submit)
    </button>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby9KSjyhSkoLNVwKWfp6aT2J06QPX08Fp-OQJqFC7Utm9jgmdC3IlDLgJN6FDi7b0v6hw/exec";
  const AUTO_PIN = "9999";

  const subjectMaxMap = {
    b1: 100, b2: 50, e1: 100, e2: 100, math: 100, rel: 100, arab: 100,
    bgs: 100, sci: 100, ict: 50, agri: 50, art: 50, spoken: 25, moral: 50, drill: 25
  };

  function showStatus(msg, isError = false) {
    const box = document.getElementById('statusBox');
    box.innerText = msg;
    box.className = 'status-box ' + (isError ? 'status-err' : 'status-ok');
    box.style.display = 'block';
  }

  function calcPreview(tr, subId) {
    const max = subjectMaxMap[subId] || 100;
    const etIn = parseFloat(tr.querySelector('.m-et').value) || 0;
    const tuIn = parseFloat(tr.querySelector('.m-tu').value) || 0;
    const et70 = Math.round(etIn * 0.70);
    const tuVal = (subId === 'ict' || subId === 'agri' || subId === 'b2') ? Math.round(tuIn * 0.50) : tuIn;
    let tot = et70 + tuVal;
    if (tot > max) tot = max;

    const pct = (tot / max) * 100;
    let gr = 'F';
    if (pct >= 80) gr = 'A+';
    else if (pct >= 70) gr = 'A';
    else if (pct >= 60) gr = 'A-';
    else if (pct >= 50) gr = 'B';
    else if (pct >= 40) gr = 'C';

    tr.querySelector('.m-tot').innerText = tot;
    tr.querySelector('.m-gr').innerText = gr;
  }

  async function loadStudents() {
    const cls = document.getElementById('tClass').value.trim();
    const sec = document.getElementById('tSection').value.trim();
    const shift = document.getElementById('tShift').value.trim();
    const year = document.getElementById('tYear').value.trim();
    const subject = document.getElementById('tSubject').value;

    const btn = document.getElementById('loadBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> লোড হচ্ছে...';
    document.getElementById('marksSection').style.display = 'none';

    try {
      const url = `${SCRIPT_URL}?action=getSubject&cls=${encodeURIComponent(cls)}&sec=${encodeURIComponent(sec)}&shift=${encodeURIComponent(shift)}&year=${encodeURIComponent(year)}&subject=${encodeURIComponent(subject)}&pin=${AUTO_PIN}`;
      const res = await fetch(url);
      const data = await res.json();

      if (data.status !== 'ok') {
        showStatus(data.message || 'ডেটা লোড করা যায়নি।', true);
        return;
      }

      const tbody = document.getElementById('marksBody');
      tbody.innerHTML = '';

      data.students.forEach(st => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><b>${st.roll}</b></td>
          <td class="name-col">${st.name}</td>
          <td><input type="number" class="m-et" value="${st.et}" oninput="calcPreview(this.closest('tr'), '${subject}')"></td>
          <td><input type="number" class="m-tu" value="${st.tu}" oninput="calcPreview(this.closest('tr'), '${subject}')"></td>
          <td><span class="badge-tot m-tot">0</span></td>
          <td><span class="badge-gr m-gr">-</span></td>
        `;
        tr.dataset.roll = st.roll;
        tbody.appendChild(tr);
        calcPreview(tr, subject);
      });

      document.getElementById('marksSection').style.display = 'block';
      showStatus(`✅ ${data.students.length} জন শিক্ষার্থীর তালিকা লোড হয়েছে। নম্বর বসিয়ে নিচে সেভ করুন।`);
    } catch (err) {
      showStatus('সার্ভারের সাথে সংযোগ ব্যর্থ হয়েছে। ইন্টারনেট চেক করুন।', true);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-down"></i> শিক্ষার্থী তালিকা লোড করুন';
    }
  }

  async function saveMarks() {
    const cls = document.getElementById('tClass').value.trim();
    const sec = document.getElementById('tSection').value.trim();
    const shift = document.getElementById('tShift').value.trim();
    const year = document.getElementById('tYear').value.trim();
    const subject = document.getElementById('tSubject').value;

    const rows = document.querySelectorAll('#marksBody tr');
    const marks = [];
    rows.forEach(tr => {
      marks.push({
        roll: tr.dataset.roll,
        et: tr.querySelector('.m-et').value,
        tu: tr.querySelector('.m-tu').value
      });
    });

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> সেভ হচ্ছে...';

    try {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'saveSubjectMarks',
          cls, sec, shift, year, subject, pin: AUTO_PIN, marks
        })
      });
      const data = await res.json();
      if (data.status === 'ok') {
        showStatus('✅ ' + data.message);
      } else {
        showStatus('❌ ' + (data.message || 'সেভ করা যায়নি।'), true);
      }
    } catch (err) {
      showStatus('সেভ করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।', true);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> নম্বর সেভ করুন (Submit)';
    }
  }
</script>
</body>
</html>
