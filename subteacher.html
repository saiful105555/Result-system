<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>বিষয় শিক্ষক নম্বর এন্ট্রি - ইবনে তাইমিয়া স্কুল এন্ড কলেজ</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; font-family: 'Hind Siliguri', 'Poppins', sans-serif; }
    button, input, select { transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease; }

    body {
      margin: 0; padding: 14px 10px 30px; min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #1e293b;
    }
    .container {
      max-width: 860px; margin: 0 auto; background: #fff;
      border-radius: 16px; padding: 20px 18px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .header {
      background: linear-gradient(135deg, #4338ca, #6d28d9, #be185d);
      color: #fff; padding: 18px 20px; border-radius: 12px;
      text-align: center; margin-bottom: 18px;
    }
    .header h1 { margin: 0; font-size: 22px; }
    .header p { margin: 4px 0 0; font-size: 14px; color: #e0e7ff; }

    .filter-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 12px; background: #f8fafc; padding: 16px;
      border-radius: 12px; border: 1.5px solid #cbd5e1; margin-bottom: 16px;
    }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 13px; font-weight: 700; color: #334155; }
    .field input, .field select {
      padding: 10px 12px; border: 2px solid #cbd5e1; border-radius: 8px;
      font-size: 15px; font-weight: 600; background: #fff; color: #0f172a; width: 100%;
    }
    .field input:focus, .field select:focus {
      border-color: #4f46e5; outline: none; box-shadow: 0 0 0 3px rgba(79,70,229,0.2);
    }

    .pin-wrap { position: relative; display: flex; align-items: center; }
    .pin-wrap input { padding-right: 40px; }
    .pin-toggle {
      position: absolute; right: 10px; background: none; border: none;
      color: #64748b; cursor: pointer; font-size: 15px; padding: 4px;
    }

    .btn {
      width: 100%; padding: 13px 18px; border: none; border-radius: 10px;
      font-size: 16px; font-weight: 700; cursor: pointer; color: #fff;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-load { background: linear-gradient(135deg, #2563eb, #4f46e5); }
    .btn-load:hover:not(:disabled) { filter: brightness(1.06); }
    .btn-save {
      background: linear-gradient(135deg, #059669, #10b981);
      margin-top: 14px; position: sticky; bottom: 10px; z-index: 15;
      box-shadow: 0 8px 20px rgba(16,185,129,0.4);
    }
    .btn-save:hover:not(:disabled) { filter: brightness(1.05); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .status-box {
      padding: 12px 15px; border-radius: 10px; margin: 14px 0;
      font-weight: 600; font-size: 14px; display: none; line-height: 1.5;
    }
    .status-ok { background: #ecfdf5; color: #065f46; border: 1.5px solid #6ee7b7; }
    .status-err { background: #fef2f2; color: #991b1b; border: 1.5px solid #fca5a5; }
    .status-warn { background: #fffbeb; color: #92400e; border: 1.5px solid #fcd34d; }

    /* Locked Context Banner & Progress Bar */
    .context-banner {
      background: #eef2ff; border: 2px solid #818cf8; border-radius: 10px;
      padding: 12px 14px; margin-top: 12px; display: flex;
      flex-direction: column; gap: 6px;
    }
    .context-banner-top {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 8px; font-weight: 700; color: #1e1b4b; font-size: 15px;
    }
    .context-meta {
      display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; color: #3730a3; font-weight: 600;
    }
    .pill {
      background: #fff; border: 1px solid #c7d2fe; padding: 3px 10px;
      border-radius: 99px; display: inline-flex; align-items: center; gap: 5px;
    }
    .pill-draft { background: #fef3c7; border-color: #fcd34d; color: #92400e; }
    .pill-err { background: #fee2e2; border-color: #fca5a5; color: #b91c1c; }
    .pill-ok { background: #dcfce7; border-color: #86efac; color: #166534; }

    .table-wrap {
      overflow: auto; max-height: 62vh; margin-top: 12px; margin-bottom: 16px;
      border-radius: 10px; border: 1.5px solid #cbd5e1; position: relative;
    }
    table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
    th, td { border-right: 1px solid #cbd5e1; border-bottom: 1px solid #cbd5e1; padding: 8px 6px; text-align: center; }
    th:last-child, td:last-child { border-right: none; }
    thead th {
      position: sticky; top: 0; z-index: 5;
      background: #1e1b4b; color: #fff; font-size: 13.5px; white-space: nowrap;
    }
    thead th:first-child { left: 0; z-index: 6; }
    tbody td:first-child {
      position: sticky; left: 0; z-index: 3; background: #eef2ff;
      font-weight: 700; color: #1e1b4b; box-shadow: 2px 0 4px rgba(0,0,0,0.06);
    }
    tbody tr:nth-child(even) { background: #f8fafc; }
    tbody tr:nth-child(even) td:first-child { background: #e0e7ff; }
    td.name-col { text-align: left; padding-left: 10px; font-weight: 600; min-width: 145px; }

    td input[type="number"] {
      width: 74px; padding: 8px 6px; border: 2px solid #cbd5e1;
      border-radius: 8px; text-align: center; font-size: 15px; font-weight: 700;
      font-family: 'Poppins', sans-serif; background: #fff; color: #0f172a;
    }
    td input[type="number"]:focus { border-color: #4f46e5; outline: none; background: #eef2ff; }
    td input[type="number"].input-error {
      border-color: #dc2626 !important; background: #fef2f2 !important; color: #b91c1c !important;
    }

    .badge-tot {
      background: #e0e7ff; color: #3730a3; padding: 4px 8px;
      border-radius: 6px; font-weight: 700; display: inline-block; min-width: 34px;
    }
    .badge-gr {
      background: #fef3c7; color: #b45309; padding: 4px 8px;
      border-radius: 6px; font-weight: 700; display: inline-block; min-width: 34px;
    }
    .badge-empty { background: #f1f5f9; color: #94a3b8; }
    .badge-fail { background: #fee2e2; color: #b91c1c; }
    .badge-over { background: #dc2626; color: #ffffff; }

    .kbd-tip {
      font-size: 12.5px; color: #475569; text-align: center; margin-top: 6px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>ইবনে তাইমিয়া স্কুল এন্ড কলেজ</h1>
    <p>বিষয় শিক্ষক নম্বর এন্ট্রি পোর্টাল (অনলাইন সিঙ্ক)</p>
  </div>

  <div class="filter-grid">
    <div class="field">
      <label for="tClass">শ্রেণি (Class)</label>
      <select id="tClass" onchange="handleFilterChange(this)">
        <option value="Six">Six</option>
        <option value="Seven">Seven</option>
        <option value="Eight" selected>Eight</option>
      </select>
    </div>
    <div class="field">
      <label for="tSection">শাখা (Section)</label>
      <select id="tSection" onchange="handleFilterChange(this)">
        <option value="A" selected>A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
        <option value="E">E</option>
        <option value="F">F</option>
      </select>
    </div>
    <div class="field">
      <label for="tShift">শিফট (Shift)</label>
      <select id="tShift" onchange="handleFilterChange(this)">
        <option value="Joba" selected>Joba</option>
        <option value="Beli">Beli</option>
        <option value="Bokul">Bokul</option>
        <option value="Shapla">Shapla</option>
      </select>
    </div>
    <div class="field">
      <label for="tYear">সাল (Year)</label>
      <input type="text" id="tYear" value="2026" onchange="handleFilterChange(this)">
    </div>
    <div class="field">
      <label for="tPin">পিন নম্বর (PIN)</label>
      <div class="pin-wrap">
        <input type="password" id="tPin" placeholder="পিন দিন" autocomplete="off" oninput="saveSessionPin()">
        <button type="button" class="pin-toggle" onclick="togglePinVisibility()" title="পিন দেখুন/লুকান">
          <i class="fa-solid fa-eye" id="pinEyeIcon"></i>
        </button>
      </div>
    </div>
    <div class="field" style="grid-column: 1 / -1;">
      <label for="tSubject">আপনার বিষয় নির্বাচন করুন</label>
      <select id="tSubject" onchange="handleFilterChange(this)">
        <option value="b1">বাংলা-১ (পূর্ণমান ১০০ | পাস ৪০)</option>
        <option value="b2">বাংলা-২ (পূর্ণমান ৫০ | পাস ২০)</option>
        <option value="e1">ইংরেজি-১ (পূর্ণমান ১০০ | পাস ৪০)</option>
        <option value="e2">ইংরেজি-২ (পূর্ণমান ১০০ | পাস ৪০)</option>
        <option value="math">গণিত (পূর্ণমান ১০০ | পাস ৪০)</option>
        <option value="rel">ধর্ম শিক্ষা (পূর্ণমান ১০০ | পাস ৪০)</option>
        <option value="arab">আরবী (পূর্ণমান ১০০ | পাস ৪০)</option>
        <option value="bgs">BGS (পূর্ণমান ১০০ | পাস ৪০)</option>
        <option value="sci">বিজ্ঞান (পূর্ণমান ১০০ | পাস ৪০)</option>
        <option value="ict">ICT (পূর্ণমান ৫০ | পাস ২০)</option>
        <option value="agri">Agriculture / Home Science (পূর্ণমান ৫০ | পাস ২০)</option>
        <option value="art">Art &amp; Craft (পূর্ণমান ৫০ | পাস ২০)</option>
        <option value="spoken">Spoken English (পূর্ণমান ২৫ | পাস ১৫)</option>
        <option value="moral">Moral Activities (পূর্ণমান ৫০ | পাস ২০)</option>
        <option value="drill">ড্রীল (পূর্ণমান ২৫ | পাস ১৫)</option>
      </select>
    </div>
  </div>

  <button type="button" class="btn btn-load" id="loadBtn" onclick="loadStudents()">
    <i class="fa-solid fa-cloud-arrow-down"></i> শিক্ষার্থী তালিকা লোড করুন
  </button>

  <div id="statusBox" class="status-box"></div>

  <div id="marksSection" style="display:none;">
    <div class="context-banner">
      <div class="context-banner-top">
        <span id="activeContextTitle"></span>
        <span id="draftStatusPill" class="pill pill-ok"><i class="fa-solid fa-cloud-check"></i> সিঙ্কড</span>
      </div>
      <div class="context-meta" id="progressMeta"></div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:62px;">রোল</th>
            <th style="text-align:left; padding-left:10px;">শিক্ষার্থীর নাম</th>
            <th>ET</th>
            <th>Tu</th>
            <th>Tot</th>
            <th>Gr</th>
          </tr>
        </thead>
        <tbody id="marksBody"></tbody>
      </table>
    </div>

    <div class="kbd-tip">
      <i class="fa-regular fa-keyboard"></i> টিপস: কম্পিউটারে দ্রুত এন্ট্রির জন্য নম্বর লিখে <b>Enter</b> চাপলে পরের ঘরে চলে যাবে।
    </div>

    <button type="button" class="btn btn-save" id="saveBtn" onclick="saveMarks()">
      <i class="fa-solid fa-cloud-arrow-up"></i> নম্বর সেভ করুন (Submit)
    </button>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby9KSjyhSkoLNVwKWfp6aT2J06QPX08Fp-OQJqFC7Utm9jgmdC3IlDLgJN6FDi7b0v6hw/exec";

  const SUBJECT_CONFIG = {
    b1:     { label: 'বাংলা-১', max: 100, pass: 40, tuHalf: false },
    b2:     { label: 'বাংলা-২', max: 50,  pass: 20, tuHalf: true },
    e1:     { label: 'ইংরেজি-১', max: 100, pass: 40, tuHalf: false },
    e2:     { label: 'ইংরেজি-২', max: 100, pass: 40, tuHalf: false },
    math:   { label: 'গণিত', max: 100, pass: 40, tuHalf: false },
    rel:    { label: 'ধর্ম শিক্ষা', max: 100, pass: 40, tuHalf: false },
    arab:   { label: 'আরবী', max: 100, pass: 40, tuHalf: false },
    bgs:    { label: 'BGS', max: 100, pass: 40, tuHalf: false },
    sci:    { label: 'বিজ্ঞান', max: 100, pass: 40, tuHalf: false },
    ict:    { label: 'ICT', max: 50,  pass: 20, tuHalf: true },
    agri:   { label: 'Agriculture / Home Science', max: 50, pass: 20, tuHalf: true },
    art:    { label: 'Art & Craft', max: 50, pass: 20, tuHalf: false },
    spoken: { label: 'Spoken English', max: 25, pass: 15, tuHalf: false },
    moral:  { label: 'Moral Activities', max: 50, pass: 20, tuHalf: false },
    drill:  { label: 'ড্রীল', max: 25, pass: 15, tuHalf: false }
  };

  let loadedContext = null;
  let hasUnsavedChanges = false;
  let draftTimer = null;
  let lastFilterValues = {};

  /* =======================================================
     INITIALIZATION & UTILITIES
     ======================================================= */
  window.onload = function() {
    const savedPin = sessionStorage.getItem('itsc_teacher_pin');
    if (savedPin) {
      document.getElementById('tPin').value = savedPin;
    }
    snapshotFilters();
  };

  window.addEventListener('beforeunload', function(e) {
    if (hasUnsavedChanges) {
      saveDraftNow();
      e.preventDefault();
      e.returnValue = '';
    }
  });

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function toBnNum(val) {
    return String(val ?? '').replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
  }

  function normalizeRollKey(val) {
    const en = String(val ?? '').replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d)).trim();
    return /^\d+$/.test(en) ? String(parseInt(en, 10)) : en.toLowerCase();
  }

  function snapshotFilters() {
    lastFilterValues = {
      tClass: document.getElementById('tClass').value,
      tSection: document.getElementById('tSection').value,
      tShift: document.getElementById('tShift').value,
      tYear: document.getElementById('tYear').value,
      tSubject: document.getElementById('tSubject').value
    };
  }

  function restoreFilters() {
    Object.keys(lastFilterValues).forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = lastFilterValues[id];
    });
  }

  function saveSessionPin() {
    sessionStorage.setItem('itsc_teacher_pin', document.getElementById('tPin').value.trim());
  }

  function togglePinVisibility() {
    const input = document.getElementById('tPin');
    const icon = document.getElementById('pinEyeIcon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.className = 'fa-solid fa-eye-slash';
    } else {
      input.type = 'password';
      icon.className = 'fa-solid fa-eye';
    }
  }

  function showStatus(msg, type = 'ok') {
    const box = document.getElementById('statusBox');
    box.innerText = msg;
    const clsMap = { ok: 'status-ok', err: 'status-err', warn: 'status-warn' };
    box.className = 'status-box ' + (clsMap[type] || 'status-ok');
    box.style.display = 'block';
  }

  function getDraftKey(ctx) {
    return `itsc_teacher_draft_v2_${ctx.cls}_${ctx.sec}_${ctx.shift}_${ctx.year}_${ctx.subject}`;
  }

  /* =======================================================
     FILTER CHANGE GUARD (PREVENTS CROSS-SECTION OVERWRITE)
     ======================================================= */
  function handleFilterChange(changedEl) {
    if (loadedContext) {
      if (hasUnsavedChanges) {
        const proceed = confirm(
          `⚠️ আপনার বর্তমান তালিকা (${loadedContext.cls} | শাখা: ${loadedContext.sec} | ${loadedContext.subjectLabel})-এ আনসেভড নম্বর রয়েছে!\n\n` +
          `ফিল্টার পরিবর্তন করলে বর্তমান টেবিলটি বন্ধ হয়ে যাবে (যদিও খসড়া ব্রাউজারে সেভ থাকবে)। এগিয়ে যেতে চান?`
        );
        if (!proceed) {
          restoreFilters();
          return;
        }
        saveDraftNow();
      }
      loadedContext = null;
      hasUnsavedChanges = false;
      document.getElementById('marksBody').innerHTML = '';
      document.getElementById('marksSection').style.display = 'none';
      showStatus('ℹ️ শ্রেণি/শাখা বা বিষয় পরিবর্তন করা হয়েছে। নতুন তালিকা দেখতে "শিক্ষার্থী তালিকা লোড করুন" বাটনে ক্লিক করুন।', 'warn');
    }
    snapshotFilters();
  }

  /* =======================================================
     CALCULATION & VALIDATION (MATCHES MAIN PROGRESS REPORT)
     ======================================================= */
  function evaluateRowMarks(tr, subId) {
    const cfg = SUBJECT_CONFIG[subId] || { max: 100, pass: 40, tuHalf: false };
    const etEl = tr.querySelector('.m-et');
    const tuEl = tr.querySelector('.m-tu');
    const etRaw = etEl.value.trim();
    const tuRaw = tuEl.value.trim();
    const hasInput = etRaw !== '' || tuRaw !== '';

    const etIn = etRaw !== '' ? parseFloat(etRaw) : 0;
    const tuIn = tuRaw !== '' ? parseFloat(tuRaw) : 0;

    const isNegative = (etIn < 0) || (tuIn < 0) || Number.isNaN(etIn) || Number.isNaN(tuIn);
    const safeEt = isNegative ? 0 : etIn;
    const safeTu = isNegative ? 0 : tuIn;

    // মূল Progress Report-এর সাথে হুবহু মিল রেখে ফ্লোটিং-পয়েন্ট ফিক্স
    const et70 = Math.round(Number((safeEt * 0.70).toFixed(4)));
    const tuVal = cfg.tuHalf ? Math.round(Number((safeTu * 0.50).toFixed(4))) : safeTu;
    const rawTot = et70 + tuVal;
    const isOverLimit = rawTot > cfg.max;
    const isInvalid = isNegative || isOverLimit;

    let gr = '-';
    if (hasInput) {
      if (isInvalid) {
        gr = 'ERR';
      } else if (rawTot < cfg.pass) {
        gr = 'F';
      } else {
        const pct = (rawTot / cfg.max) * 100;
        if (pct >= 80) gr = 'A+';
        else if (pct >= 70) gr = 'A';
        else if (pct >= 60) gr = 'A-';
        else if (pct >= 50) gr = 'B';
        else if (pct >= 40) gr = 'C';
        else gr = 'F';
      }
    }

    return { hasInput, rawTot, gr, isOverLimit, isNegative, isInvalid, max: cfg.max };
  }

  function calcPreview(tr, subId, markDirty = false) {
    const res = evaluateRowMarks(tr, subId);
    const etEl = tr.querySelector('.m-et');
    const tuEl = tr.querySelector('.m-tu');
    const totEl = tr.querySelector('.m-tot');
    const grEl = tr.querySelector('.m-gr');

    etEl.classList.toggle('input-error', res.isInvalid);
    tuEl.classList.toggle('input-error', res.isInvalid);

    if (!res.hasInput) {
      totEl.innerText = '-';
      totEl.className = 'badge-tot badge-empty m-tot';
      totEl.title = '';
      grEl.innerText = '-';
      grEl.className = 'badge-gr badge-empty m-gr';
    } else if (res.isInvalid) {
      totEl.innerText = res.isNegative ? 'ERR' : res.rawTot;
      totEl.className = 'badge-tot badge-over m-tot';
      totEl.title = res.isNegative
        ? 'ঋণাত্মক নম্বর গ্রহণযোগ্য নয়!'
        : `হিসাবকৃত মোট (${res.rawTot}) পূর্ণমান (${res.max})-এর চেয়ে বেশি!`;
      grEl.innerText = 'ERR';
      grEl.className = 'badge-gr badge-over m-gr';
    } else {
      totEl.innerText = res.rawTot;
      totEl.className = 'badge-tot m-tot';
      totEl.title = '';
      grEl.innerText = res.gr;
      grEl.className = 'badge-gr m-gr' + (res.gr === 'F' ? ' badge-fail' : '');
    }

    if (markDirty) {
      hasUnsavedChanges = true;
      scheduleDraftSave();
    }
    updateProgressUI();
  }

  function updateProgressUI() {
    if (!loadedContext) return;
    const rows = Array.from(document.querySelectorAll('#marksBody tr'));
    const total = rows.length;
    let filled = 0;
    let errors = 0;

    rows.forEach(tr => {
      const res = evaluateRowMarks(tr, loadedContext.subject);
      if (res.hasInput) filled++;
      if (res.isInvalid) errors++;
    });

    const empty = total - filled;
    const cfg = SUBJECT_CONFIG[loadedContext.subject];
    const formulaText = cfg.tuHalf ? 'ET×৭০% + Tu×৫০%' : 'ET×৭০% + Tu';

    document.getElementById('progressMeta').innerHTML = `
      <span class="pill"><i class="fa-solid fa-calculator"></i> পূর্ণমান: ${toBnNum(cfg.max)} | পাস: ${toBnNum(cfg.pass)} (${formulaText})</span>
      <span class="pill pill-ok"><i class="fa-solid fa-check"></i> এন্ট্রি হয়েছে: ${toBnNum(filled)} / ${toBnNum(total)} জন</span>
      <span class="pill">বাকি: ${toBnNum(empty)} জন</span>
      ${errors > 0 ? `<span class="pill pill-err"><i class="fa-solid fa-triangle-exclamation"></i> ভুল নম্বর: ${toBnNum(errors)} টি</span>` : ''}
    `;

    const draftPill = document.getElementById('draftStatusPill');
    if (hasUnsavedChanges) {
      draftPill.className = 'pill pill-draft';
      draftPill.innerHTML = '<i class="fa-solid fa-pen-to-square"></i> আনসেভড (খসড়া সংরক্ষিত)';
    } else {
      draftPill.className = 'pill pill-ok';
      draftPill.innerHTML = '<i class="fa-solid fa-cloud-check"></i> ক্লাউডে সেভ আছে';
    }
  }

  /* =======================================================
     LOCAL AUTO-DRAFT STORAGE
     ======================================================= */
  function collectMarksFromTable() {
    const rows = document.querySelectorAll('#marksBody tr');
    const marks = [];
    rows.forEach(tr => {
      marks.push({
        roll: tr.dataset.roll,
        et: tr.querySelector('.m-et').value.trim(),
        tu: tr.querySelector('.m-tu').value.trim()
      });
    });
    return marks;
  }

  function saveDraftNow() {
    if (!loadedContext) return;
    try {
      const payload = {
        savedAt: new Date().toISOString(),
        marks: collectMarksFromTable()
      };
      localStorage.setItem(getDraftKey(loadedContext), JSON.stringify(payload));
    } catch (e) {
      console.warn('Draft save failed:', e);
    }
  }

  function scheduleDraftSave() {
    clearTimeout(draftTimer);
    draftTimer = setTimeout(saveDraftNow, 300);
  }

  function clearCurrentDraft() {
    if (!loadedContext) return;
    localStorage.removeItem(getDraftKey(loadedContext));
  }

  /* =======================================================
     KEYBOARD ENTER NAVIGATION & WHEEL GUARD
     ======================================================= */
  function handleInputKeydown(e, inputEl) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const inputs = Array.from(document.querySelectorAll('#marksBody input[type="number"]'));
    const idx = inputs.indexOf(inputEl);
    if (idx >= 0 && idx + 1 < inputs.length) {
      const next = inputs[idx + 1];
      next.focus();
      next.select();
    } else if (idx === inputs.length - 1) {
      document.getElementById('saveBtn').focus();
    }
  }

  /* =======================================================
     LOAD & SAVE (GOOGLE SHEETS SYNC)
     ======================================================= */
  async function loadStudents() {
    const cls = document.getElementById('tClass').value.trim();
    const sec = document.getElementById('tSection').value.trim();
    const shift = document.getElementById('tShift').value.trim();
    const year = document.getElementById('tYear').value.trim();
    const subject = document.getElementById('tSubject').value;
    const pin = document.getElementById('tPin').value.trim();

    if (!cls || !sec || !shift || !year) {
      showStatus('⚠️ অনুগ্রহ করে শ্রেণি, শাখা, শিফট এবং সাল সঠিকভাবে পূরণ করুন।', 'err');
      return;
    }

    if (!pin) {
      showStatus('🔒 অনুগ্রহ করে প্রথমে আপনার শিক্ষক/অ্যাডমিন পিন নম্বর (PIN) দিন।', 'err');
      document.getElementById('tPin').focus();
      return;
    }

    if (hasUnsavedChanges && loadedContext) {
      if (!confirm('⚠️ বর্তমান তালিকায় আনসেভড নম্বর আছে। নতুন করে লোড করলে অনলাইন ডেটা দেখাবে। এগিয়ে যেতে চান?')) {
        return;
      }
    }

    saveSessionPin();
    snapshotFilters();

    const btn = document.getElementById('loadBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> লোড হচ্ছে...';
    document.getElementById('marksSection').style.display = 'none';

    try {
      const url = `${SCRIPT_URL}?action=getSubject&cls=${encodeURIComponent(cls)}&sec=${encodeURIComponent(sec)}&shift=${encodeURIComponent(shift)}&year=${encodeURIComponent(year)}&subject=${encodeURIComponent(subject)}&pin=${encodeURIComponent(pin)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      if (data.status !== 'ok') {
        showStatus('❌ ' + (data.message || 'ডেটা লোড করা যায়নি। পিন নম্বর যাচাই করুন।'), 'err');
        return;
      }

      if (!Array.isArray(data.students) || data.students.length === 0) {
        loadedContext = null;
        hasUnsavedChanges = false;
        showStatus('⚠️ এই শ্রেণি/শাখা/শিফটে কোনো শিক্ষার্থীর তালিকা পাওয়া যায়নি। আগে শ্রেণি শিক্ষককে ছাত্র তালিকা ক্লাউডে পাঠাতে বলুন।', 'warn');
        return;
      }

      const cfg = SUBJECT_CONFIG[subject] || { label: subject, max: 100, pass: 40 };
      const nextContext = { cls, sec, shift, year, subject, subjectLabel: cfg.label };

      // লোকাল আনসেভড ড্রাফট আছে কি না চেক করা
      let draftMap = null;
      let restoredDraft = false;
      const draftRaw = localStorage.getItem(getDraftKey(nextContext));
      if (draftRaw) {
        try {
          const parsedDraft = JSON.parse(draftRaw);
          if (parsedDraft && Array.isArray(parsedDraft.marks) && parsedDraft.marks.length > 0) {
            const tempMap = new Map();
            parsedDraft.marks.forEach(m => tempMap.set(normalizeRollKey(m.roll), m));

            // ক্লাউডের সাথে আদৌ পার্থক্য আছে কি না দেখি
            const hasDiff = data.students.some(st => {
              const d = tempMap.get(normalizeRollKey(st.roll));
              if (!d) return false;
              const cloudEt = (st.et !== undefined && st.et !== null) ? String(st.et).trim() : '';
              const cloudTu = (st.tu !== undefined && st.tu !== null) ? String(st.tu).trim() : '';
              return d.et !== cloudEt || d.tu !== cloudTu;
            });

            if (hasDiff) {
              const useDraft = confirm(
                `💾 এই বিষয়ের (${cls} | শাখা: ${sec} | ${cfg.label}) আগে এন্ট্রি করা একটি আনসেভড খসড়া (Draft) আপনার ডিভাইসে পাওয়া গেছে।\n\n` +
                `OK চাপলে আগের খসড়া নম্বরগুলো ফিরে আসবে।\nCancel চাপলে অনলাইনের সর্বশেষ নম্বর লোড হবে।`
              );
              if (useDraft) {
                draftMap = tempMap;
                restoredDraft = true;
              } else {
                localStorage.removeItem(getDraftKey(nextContext));
              }
            }
          }
        } catch (e) {}
      }

      loadedContext = nextContext;
      hasUnsavedChanges = restoredDraft;

      const tbody = document.getElementById('marksBody');
      tbody.innerHTML = '';

      data.students.forEach(st => {
        const rollStr = (st.roll !== undefined && st.roll !== null) ? String(st.roll) : '';
        const nameStr = (st.name !== undefined && st.name !== null) ? String(st.name) : '';
        let etVal = (st.et !== undefined && st.et !== null) ? String(st.et) : '';
        let tuVal = (st.tu !== undefined && st.tu !== null) ? String(st.tu) : '';

        if (draftMap) {
          const d = draftMap.get(normalizeRollKey(rollStr));
          if (d) {
            etVal = d.et;
            tuVal = d.tu;
          }
        }

        const tr = document.createElement('tr');
        tr.dataset.roll = rollStr;
        tr.innerHTML = `
          <td>${escapeHtml(rollStr)}</td>
          <td class="name-col">${escapeHtml(nameStr)}</td>
          <td><input type="number" min="0" max="${cfg.max}" step="any" class="m-et" value="${escapeHtml(etVal)}"></td>
          <td><input type="number" min="0" max="${cfg.max}" step="any" class="m-tu" value="${escapeHtml(tuVal)}"></td>
          <td><span class="badge-tot m-tot">-</span></td>
          <td><span class="badge-gr m-gr">-</span></td>
        `;

        const etInput = tr.querySelector('.m-et');
        const tuInput = tr.querySelector('.m-tu');

        [etInput, tuInput].forEach(inp => {
          inp.addEventListener('input', () => calcPreview(tr, subject, true));
          inp.addEventListener('keydown', (e) => handleInputKeydown(e, inp));
          inp.addEventListener('wheel', () => inp.blur(), { passive: true });
        });

        tbody.appendChild(tr);
        calcPreview(tr, subject, false);
      });

      document.getElementById('activeContextTitle').innerHTML =
        `<i class="fa-solid fa-lock"></i> ${escapeHtml(cls)} | শাখা: ${escapeHtml(sec)} | শিফট: ${escapeHtml(shift)} (${escapeHtml(year)}) — ${escapeHtml(cfg.label)}`;

      document.getElementById('marksSection').style.display = 'block';
      updateProgressUI();

      if (restoredDraft) {
        showStatus(`💾 ${toBnNum(data.students.length)} জন শিক্ষার্থীর আনসেভড খসড়া পুনরুদ্ধার হয়েছে। যাচাই করে নিচে "নম্বর সেভ করুন" বাটনে ক্লিক করুন।`, 'warn');
      } else {
        showStatus(`✅ ${toBnNum(data.students.length)} জন শিক্ষার্থীর তালিকা লোড হয়েছে। নম্বর বসিয়ে নিচে সেভ করুন।`, 'ok');
      }
    } catch (err) {
      console.error(err);
      showStatus('❌ সার্ভারের সাথে সংযোগ ব্যর্থ হয়েছে। ইন্টারনেট সংযোগ যাচাই করে আবার চেষ্টা করুন।', 'err');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-down"></i> শিক্ষার্থী তালিকা লোড করুন';
    }
  }

  async function saveMarks() {
    if (!loadedContext) {
      showStatus('⚠️ কোনো তালিকা লোড করা নেই। আগে শিক্ষার্থী তালিকা লোড করুন।', 'err');
      return;
    }

    const pin = document.getElementById('tPin').value.trim();
    if (!pin) {
      showStatus('🔒 সেভ করার জন্য পিন নম্বর (PIN) দেওয়া আবশ্যক।', 'err');
      document.getElementById('tPin').focus();
      return;
    }

    // ১. ভুল/সীমা অতিক্রম করা নম্বর আছে কি না যাচাই
    const rows = Array.from(document.querySelectorAll('#marksBody tr'));
    let filledCount = 0;
    let firstInvalidInput = null;
    let invalidRolls = [];

    rows.forEach(tr => {
      const res = evaluateRowMarks(tr, loadedContext.subject);
      if (res.hasInput) filledCount++;
      if (res.isInvalid) {
        invalidRolls.push(tr.dataset.roll);
        if (!firstInvalidInput) {
          firstInvalidInput = tr.querySelector('.m-et');
        }
      }
    });

    if (invalidRolls.length > 0) {
      showStatus(
        `❌ রোল ${invalidRolls.slice(0, 5).join(', ')}${invalidRolls.length > 5 ? '...' : ''}-এ ভুল বা পূর্ণমানের চেয়ে বেশি নম্বর দেওয়া আছে! লাল ঘরগুলো ঠিক করে আবার সেভ করুন।`,
        'err'
      );
      if (firstInvalidInput) {
        firstInvalidInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
        firstInvalidInput.focus();
      }
      return;
    }

    // ২. লক করা কনটেক্সট দেখিয়ে চূড়ান্ত কনফার্মেশন
    const { cls, sec, shift, year, subject, subjectLabel } = loadedContext;
    const emptyCount = rows.length - filledCount;
    const confirmMsg =
      `নিচের বিষয়ের নম্বর অনলাইনে সেভ করতে চান?\n\n` +
      `• শ্রেণি: ${cls} | শাখা: ${sec} | শিফট: ${shift} (${year})\n` +
      `• বিষয়: ${subjectLabel}\n` +
      `• নম্বর বসানো হয়েছে: ${toBnNum(filledCount)} জন (ফাঁকা: ${toBnNum(emptyCount)} জন)`;

    if (!confirm(confirmMsg)) return;

    const marks = collectMarksFromTable();
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> সেভ হচ্ছে...';

    try {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'saveSubjectMarks',
          cls, sec, shift, year, subject, pin, marks
        })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      if (data.status === 'ok') {
        hasUnsavedChanges = false;
        clearCurrentDraft();
        updateProgressUI();
        showStatus('✅ ' + (data.message || `${cls} (${sec}) - ${subjectLabel} এর নম্বর সফলভাবে সেভ হয়েছে!`), 'ok');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        showStatus('❌ ' + (data.message || 'সেভ করা যায়নি। পিন ও তথ্য যাচাই করুন।'), 'err');
      }
    } catch (err) {
      console.error(err);
      saveDraftNow();
      showStatus('❌ নেটওয়ার্ক সমস্যার কারণে সেভ করা যায়নি! চিন্তার কারণ নেই—আপনার বসানো নম্বরগুলো ডিভাইসে খসড়া হিসেবে নিরাপদে আছে। ইন্টারনেট ঠিক হলে আবার "নম্বর সেভ করুন" চাপুন।', 'err');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> নম্বর সেভ করুন (Submit)';
    }
  }
</script>
</body>
