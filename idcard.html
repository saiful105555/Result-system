<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রফেশনাল শিক্ষক আইডি কার্ড জেনারেটর - ইবনে তাইমিয়া স্কুল এন্ড কলেজ</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@500;600;700&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Local CORS-Free QR Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

    <style>
        :root {
            --card-primary-dark: #073317;
            --card-primary: #0f5127;
            --card-primary-light: #1b723b;
            --card-accent: #c89d43;
            --card-accent-light: #f0d796;
            --card-soft-bg: #f3f8f5;
            --card-border-soft: #d5e5db;
        }

        [data-card-theme="navy"] {
            --card-primary-dark: #0b1f3a;
            --card-primary: #143766;
            --card-primary-light: #1e4f8f;
            --card-accent: #c89d43;
            --card-accent-light: #f0d796;
            --card-soft-bg: #f2f6fb;
            --card-border-soft: #d2dfee;
        }

        [data-card-theme="maroon"] {
            --card-primary-dark: #4a0d17;
            --card-primary: #731625;
            --card-primary-light: #961f33;
            --card-accent: #c89d43;
            --card-accent-light: #f3dba0;
            --card-soft-bg: #fbf4f5;
            --card-border-soft: #edd6d9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: linear-gradient(135deg, #e8eef3 0%, #dce5ec 100%);
            min-height: 100vh;
            padding: 24px 14px 50px;
            color: #1e293b;
        }

        .app-header {
            max-width: 1120px;
            margin: 0 auto 22px;
            background: #ffffff;
            border-radius: 16px;
            padding: 16px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
            border-left: 6px solid var(--card-primary);
        }

        .app-header-title h1 {
            font-size: 1.4rem;
            color: var(--card-primary-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .app-header-title p {
            font-size: 0.9rem;
            color: #64748b;
            margin-top: 2px;
        }

        .theme-switcher {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f8fafc;
            padding: 6px 12px;
            border-radius: 30px;
            border: 1px solid #e2e8f0;
        }
        .theme-switcher span {
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            margin-right: 4px;
        }
        .theme-dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid #fff;
            cursor: pointer;
            box-shadow: 0 0 0 2px #cbd5e1;
            transition: transform 0.2s;
        }
        .theme-dot:hover { transform: scale(1.1); }
        .theme-dot.active { box-shadow: 0 0 0 2px #0f172a; transform: scale(1.1); }
        .theme-dot.green { background: linear-gradient(135deg, #073317, #1b723b); }
        .theme-dot.navy { background: linear-gradient(135deg, #0b1f3a, #1e4f8f); }
        .theme-dot.maroon { background: linear-gradient(135deg, #4a0d17, #961f33); }

        .workspace {
            max-width: 1120px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 28px;
            align-items: start;
        }

        /* Form Panel */
        .form-section {
            background: #ffffff;
            padding: 22px;
            border-radius: 18px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
            border: 1px solid #e2e8f0;
        }
        .form-section h2 {
            font-size: 1.15rem;
            color: var(--card-primary-dark);
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .input-group { margin-bottom: 12px; }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #334155;
            font-size: 0.9rem;
        }
        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: 'Hind Siliguri', sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }
        .input-group input:focus {
            border-color: var(--card-primary);
            background: #ffffff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(15, 81, 39, 0.12);
        }

        .photo-controls {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
            font-size: 0.85rem;
            color: #475569;
            font-weight: 600;
        }
        .slider-row span { width: 74px; flex-shrink: 0; }
        .slider-row input[type="range"] {
            flex: 1;
            accent-color: var(--card-primary);
            cursor: pointer;
        }

        .optional-uploads {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.88rem;
        }
        .optional-uploads summary {
            cursor: pointer;
            font-weight: 600;
            color: #475569;
        }
        .optional-uploads .inner {
            margin-top: 10px;
        }

        /* Preview Panel */
        .preview-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .side-tabs {
            display: inline-flex;
            background: #ffffff;
            padding: 5px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
            margin-bottom: 16px;
            gap: 6px;
        }
        .side-tab-btn {
            padding: 9px 20px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: #475569;
            font-family: 'Hind Siliguri', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: all 0.2s;
        }
        .side-tab-btn.active {
            background: var(--card-primary);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(15, 81, 39, 0.28);
        }

        /* Live HD Canvas Preview Stage */
        .preview-canvas-wrap {
            width: 100%;
            max-width: 390px;
            margin-bottom: 18px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.22);
            border: 1px solid #cbd5e1;
            background: #ffffff;
        }
        .preview-canvas-wrap canvas {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Action Buttons */
        .download-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 520px;
        }
        .btn-action {
            flex: 1;
            min-width: 185px;
            padding: 13px 18px;
            border: none;
            border-radius: 12px;
            font-family: 'Hind Siliguri', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn-action:hover { transform: translateY(-2px); }
        .btn-action:active { transform: translateY(0); }
        .btn-dl-front {
            background: linear-gradient(135deg, #0f5127, #1b723b);
            box-shadow: 0 6px 16px rgba(15, 81, 39, 0.3);
        }
        .btn-dl-back {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            box-shadow: 0 6px 16px rgba(29, 78, 216, 0.3);
        }

        /* Download Ready Box */
        .download-ready-box {
            display: none;
            width: 100%;
            max-width: 520px;
            margin-top: 16px;
            background: #ffffff;
            border: 2px solid #10b981;
            border-radius: 14px;

            text-align: center;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.14);
        }
        .download-ready-box p {
            font-size: 0.92rem;
            font-weight: 600;
            color: #065f46;
            margin-bottom: 10px;
        }
        .manual-dl-link {

            align-items: center;
            gap: 7px;

            color: #ffffff;

            padding: 9px 18px;
            border-radius: 10px;
            font-size: 0.94rem;

            margin-bottom: 10px;

        .saved-img-preview {
            display: block;
            max-width: 185px;
            margin: 8px auto 6px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
        }
        .save-hint {
            font-size: 0.8rem !important;
            color: #64748b !important;

            margin-bottom: 0 !important;
        }

        @media (max-width: 960px) {
            .workspace { grid-template-columns: 1fr; }
            .form-section { max-width: 520px; margin: 0 auto; width: 100%; }
        }
        @media (max-width: 480px) {
            .form-row-2 { grid-template-columns: 1fr; gap: 0; }
            .app-header { padding: 14px 16px; }
        }
    </style>
</head>
<body data-card-theme="green">

    <script>
        const THEMES = {
            green: {
                dark: "#073317",
                main: "#0f5127",
                light: "#1b723b",
                accent: "#c89d43",
                accentLight: "#f0d796",
                softBg: "#f3f8f5",
                borderSoft: "#d5e5db",
                dot: "rgba(15, 81, 39, 0.06)"
            },
            navy: {
                dark: "#0b1f3a",
                main: "#143766",
                light: "#1e4f8f",
                accent: "#c89d43",
                accentLight: "#f0d796",
                softBg: "#f2f6fb",
                borderSoft: "#d2dfee",
                dot: "rgba(20, 55, 102, 0.06)"
            },
            maroon: {
                dark: "#4a0d17",
                main: "#731625",
                light: "#961f33",
                accent: "#c89d43",
                accentLight: "#f3dba0",
                softBg: "#fbf4f5",
                borderSoft: "#edd6d9",
                dot: "rgba(115, 22, 37, 0.06)"
            }
        };

        const LOGO_URLS = [
            "https://wsrv.nl/?url=https%3A%2F%2Flh3.googleusercontent.com%2Fd%2F1ZmxR46CCr7Ge5UntTMM_TbTeMJfdiqTD&w=600&output=png",
            "https://wsrv.nl/?url=https%3A%2F%2Fdrive.google.com%2Fthumbnail%3Fid%3D1ZmxR46CCr7Ge5UntTMM_TbTeMJfdiqTD%26sz%3Dw1000&output=png",
            "https://wsrv.nl/?url=https%3A%2F%2Fdrive.google.com%2Fuc%3Fid%3D1ZmxR46CCr7Ge5UntTMM_TbTeMJfdiqTD&output=png"
        ];

        const SIGN_URLS = [
            "https://wsrv.nl/?url=https%3A%2F%2Flh3.googleusercontent.com%2Fd%2F1BNKX32ikL8Pn5Z5hd14SWmnFI05Qtm_3&w=800&output=png",
            "https://wsrv.nl/?url=https%3A%2F%2Fdrive.google.com%2Fthumbnail%3Fid%3D1BNKX32ikL8Pn5Z5hd14SWmnFI05Qtm_3%26sz%3Dw1000&output=png",
            "https://wsrv.nl/?url=https%3A%2F%2Fdrive.google.com%2Fuc%3Fexport%3Dview%26id%3D1BNKX32ikL8Pn5Z5hd14SWmnFI05Qtm_3&output=png"
        ];

        let currentTheme = "green";
        let currentSide = "front";
        let logoImg = null;
        let signImg = null;
        let photoImg = null;
        let lastBlobUrl = null;

        // CORS-নিরাপদ ছবি লোডার (কখনো ক্যানভাস ব্লক করবে না)
        function loadCorsImage(urlList) {
            return new Promise(async (resolve) => {
                for (const url of urlList) {
                    try {
                        const img = await new Promise((res, rej) => {
                            const el = new Image();
                            el.crossOrigin = "anonymous";
                            const t = setTimeout(() => rej(new Error("timeout")), 7000);
                            el.onload = () => { clearTimeout(t); res(el); };
                            el.onerror = () => { clearTimeout(t); rej(new Error("error")); };
                            el.src = url;
                        });
                        if (img && img.naturalWidth > 0) {
                            return resolve(img);
                        }
                    } catch (e) {}
                }
                resolve(null);
            });
        }

        // স্বাক্ষরের ব্যাকগ্রাউন্ড পরিষ্কার করা (প্রয়োজনে) এবং বাড়তি ফাঁকা অংশ অটো-ক্রপ করা
        function cleanSignatureBackground(img) {
            try {
                const w = img.naturalWidth || img.width;
                const h = img.naturalHeight || img.height;
                if (!w || !h) return img;

                const c = document.createElement("canvas");
                c.width = w;
                c.height = h;
                const ctx = c.getContext("2d");
                ctx.drawImage(img, 0, 0);

                const imgData = ctx.getImageData(0, 0, w, h);
                const d = imgData.data;

                // ছবিটি আগে থেকেই ট্রান্সপারেন্ট PNG কি না তা যাচাই
                let transparentPixels = 0;
                const totalPixels = w * h;
                for (let i = 3; i < d.length; i += 4) {
                    if (d[i] < 240) transparentPixels++;
                }
                const alreadyTransparent = (transparentPixels / totalPixels) > 0.08;

                // সাদা ব্যাকগ্রাউন্ড থাকলে স্মুথলি ট্রান্সপারেন্ট করা
                if (!alreadyTransparent) {
                    for (let i = 0; i < d.length; i += 4) {
                        const r = d[i], g = d[i + 1], b = d[i + 2];
                        const brightness = (r + g + b) / 3;
                        const sat = Math.max(r, g, b) - Math.min(r, g, b);

                        if (brightness > 215 && sat < 35) {
                            d[i + 3] = 0;
                        } else if (brightness > 175 && sat < 35) {
                            const alphaFactor = (215 - brightness) / 40;
                            d[i + 3] = Math.round(d[i + 3] * alphaFactor);
                            d[i] = Math.max(0, r - 35);
                            d[i + 1] = Math.max(0, g - 35);
                            d[i + 2] = Math.max(0, b - 35);
                        } else {
                            d[i] = Math.max(0, r - 35);
                            d[i + 1] = Math.max(0, g - 35);
                            d[i + 2] = Math.max(0, b - 35);
                        }
                    }
                    ctx.putImageData(imgData, 0, 0);
                }

                // চারপাশের বাড়তি খালি/ট্রান্সপারেন্ট মার্জিন অটো-ক্রপ করা
                let minX = w, minY = h, maxX = -1, maxY = -1;
                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        if (d[(y * w + x) * 4 + 3] > 18) {
                            if (x < minX) minX = x;
                            if (x > maxX) maxX = x;
                            if (y < minY) minY = y;
                            if (y > maxY) maxY = y;
                        }
                    }
                }

                if (maxX >= minX && maxY >= minY) {
                    const pad = 4;
                    const cropX = Math.max(0, minX - pad);
                    const cropY = Math.max(0, minY - pad);
                    const cropW = Math.min(w - cropX, (maxX - minX + 1) + pad * 2);
                    const cropH = Math.min(h - cropY, (maxY - minY + 1) + pad * 2);

                    const trimmed = document.createElement("canvas");
                    trimmed.width = cropW;
                    trimmed.height = cropH;
                    trimmed.getContext("2d").drawImage(c, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
                    return trimmed;
                }

                return c;
            } catch (e) {
                return img;
            }
        }

        function handleLocalImage(input, type) {
            if (!input.files || !input.files[0]) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    if (type === "photo") {
                        photoImg = img;
                        document.getElementById("photoZoom").value = 1;
                        document.getElementById("photoPosY").value = 0;
                    } else if (type === "logo") {
                        logoImg = img;
                    } else if (type === "sign") {
                        signImg = cleanSignatureBackground(img);
                    }
                    renderPreview();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }

        function drawRoundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight) {
            const words = text.split(" ");
            let line = "";
            let currY = y;
            for (let i = 0; i < words.length; i++) {
                const testLine = line + (line ? " " : "") + words[i];
                if (ctx.measureText(testLine).width > maxWidth && line) {
                    ctx.fillText(line, x, currY);
                    line = words[i];
                    currY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            if (line) {
                ctx.fillText(line, x, currY);
                currY += lineHeight;
            }
            return currY;
        }

        function drawContainImage(ctx, img, x, y, w, h) {
            const iw = img.naturalWidth || img.width;
            const ih = img.naturalHeight || img.height;
            if (!iw || !ih) return;
            const scale = Math.min(w / iw, h / ih);
            const dw = iw * scale;
            const dh = ih * scale;
            ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
        }

        // স্বাক্ষরকে লাইনের ঠিক উপরে সেন্টার ও বটম-অ্যালাইন করে আঁকা
        function drawSignatureImage(ctx, img, cx, bottomY, maxW, maxH) {
            const iw = img.naturalWidth || img.width;
            const ih = img.naturalHeight || img.height;
            if (!iw || !ih) return;
            const scale = Math.min(maxW / iw, maxH / ih);
            const dw = iw * scale;
            const dh = ih * scale;
            ctx.drawImage(img, cx - dw / 2, bottomY - dh, dw, dh);
        }

        function createLocalQRCanvas(data) {
            const qrText = `ITSC | ${data.name} | ${data.desig} | ID: ${data.idNo} | Dept: ${data.dept} | Shift: ${data.shift} | Tel: ${data.phone} | Blood: ${data.blood}`;
            if (typeof QRious === "function") {
                const qr = new QRious({
                    value: qrText,
                    size: 260,
                    level: "M",
                    background: "#ffffff",
                    foreground: "#0f172a"
                });
                return qr.canvas;
            }
            return null;
        }

            ctx.lineWidth = 1.5;
            ctx.stroke();

            drawRoundRect(ctx, qbx + 16, qby + 15, 122, 122, 10);
            ctx.fillStyle = "#ffffff";
            ctx.fill();
            ctx.strokeStyle = theme.accent;
            ctx.lineWidth = 2;
            ctx.stroke();

            const qrCanvas = createLocalQRCanvas(data);
            if (qrCanvas) {
                ctx.drawImage(qrCanvas, qbx + 22, qby + 21, 110, 110);
            }

            ctx.textAlign = "left";
            ctx.fillStyle = theme.dark;
            ctx.font = '700 19px "Hind Siliguri", sans-serif';
            ctx.fillText("ডিজিটাল ভেরিফিকেশন", qbx + 156, qby + 44);

            ctx.fillStyle = "#475569";
            ctx.font = '500 14.5px "Hind Siliguri", sans-serif';
            drawWrappedText(
                ctx,
                "এই QR কোডটি স্ক্যান করলে শিক্ষকের নাম, পদবী, আইডি নম্বর, জরুরি ফোন নম্বর ও রক্তের গ্রুপ তাৎক্ষণিক দেখা যাবে।",
                qbx + 156, qby + 72, 292, 22
            );

            // ৩. ব্যবহারের শর্তাবলী বক্স
            const rbx = 36, rby = 294, rbw = 468, rbh = 224;
            drawRoundRect(ctx, rbx, rby, rbw, rbh, 12);
            ctx.fillStyle = "rgba(255, 255, 255, 0.96)";
            ctx.fill();
            ctx.strokeStyle = theme.borderSoft;
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // বাম গোল্ড অ্যাক্সেন্ট বার
            drawRoundRect(ctx, rbx, rby, 6, rbh, 3);
            ctx.fillStyle = theme.accent;
            ctx.fill();

            ctx.textAlign = "left";
            ctx.fillStyle = theme.dark;
            ctx.font = '700 18px "Hind Siliguri", sans-serif';
            ctx.fillText("ব্যবহারের শর্তাবলী", rbx + 24, rby + 34);

            const rules = [
                "এই পরিচয়পত্রটি প্রতিষ্ঠানের সম্পত্তি এবং কোনো অবস্থাতেই হস্তান্তরযোগ্য নয়।",
                "প্রতিষ্ঠান চলাকালীন সময়ে এই কার্ডটি দৃশ্যমানভাবে সাথে রাখা আবশ্যক।",
                "কার্ডটি হারিয়ে গেলে দ্রুত অধ্যক্ষ কার্যালয়ে অবহিত করার অনুরোধ করা হলো।",
                "কেউ কার্ডটি খুঁজে পেলে অনুগ্রহ করে নিচের ঠিকানায় জমা দিন।"
            ];

            let ruleY = rby + 64;
            ctx.font = '500 14.5px "Hind Siliguri", sans-serif';
            rules.forEach(rule => {
                ctx.fillStyle = theme.main;
                ctx.beginPath();
                ctx.arc(rbx + 28, ruleY - 5, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#334155";
                ruleY = drawWrappedText(ctx, rule, rbx + 42, ruleY, 408, 20) + 6;
            });

            // ৪. ইস্যু ও মেয়াদ বক্স
            const vy = 538, vh = 68;
            const drawValidityBox = (x, title, val) => {
                drawRoundRect(ctx, x, vy, 228, vh, 12);
                ctx.fillStyle = "#ffffff";
                ctx.fill();
                ctx.strokeStyle = theme.borderSoft;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.textAlign = "center";
                ctx.fillStyle = "#64748b";
                ctx.font = '600 13px "Hind Siliguri", sans-serif';
                ctx.fillText(title, x + 114, vy + 26);

                ctx.fillStyle = theme.dark;
                ctx.font = '700 17px "Hind Siliguri", sans-serif';
                ctx.fillText(val, x + 114, vy + 52);
            };
            drawValidityBox(36,  "ইস্যু তারিখ (Issue Date)", data.issue);
            drawValidityBox(276, "মেয়াদ উত্তীর্ণ (Valid Till)", data.valid);

            // ৫. প্রতিষ্ঠানের যোগাযোগ কার্ড
            const cbx = 36, cby = 626, cbw = 468, cbh = 172;
            const contactGrad = ctx.createLinearGradient(cbx, cby, cbx + cbw, cby + cbh);
            contactGrad.addColorStop(0, theme.dark);
            contactGrad.addColorStop(1, theme.main);

            drawRoundRect(ctx, cbx, cby, cbw, cbh, 14);
            ctx.fillStyle = contactGrad;
            ctx.fill();
            ctx.strokeStyle = theme.accent;
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.textAlign = "center";
            ctx.fillStyle = "#ffffff";
            ctx.font = '700 22px "Tiro Bangla", "Hind Siliguri", sans-serif';
            ctx.fillText("ইবনে তাইমিয়া স্কুল এন্ড কলেজ", 270, cby + 38);

            // EIIN ব্যাজ
            drawRoundRect(ctx, 178, cby + 48, 184, 24, 12);
            ctx.fillStyle = "rgba(255, 255, 255, 0.14)";
            ctx.fill();
            ctx.fillStyle = theme.accentLight;
            ctx.font = '700 12px "Poppins", "Hind Siliguri", sans-serif';
            ctx.fillText("EIIN: 105751  •  স্থাপিত: ১৯৭৯", 270, cby + 64);

            ctx.fillStyle = "#f1f5f9";
            ctx.font = '500 14.5px "Hind Siliguri", sans-serif';
            ctx.fillText("১নং ইপিজেড রোড, টমছমব্রীজ, কুমিল্লা", 270, cby + 98);
            ctx.fillText("ফোন: ০২৩৩৪৪০৫৭৪৪   |   www.itsc.edu.bd", 270, cby + 124);
            ctx.fillText("ই-মেইল: ibntaimia1979@gmail.com", 270, cby + 150);

            // ৬. বটম বার
            drawBottomBar(ctx, theme, "শিক্ষা  •  শৃঙ্খলা  •  নৈতিকতা   |   IT Department");
        }

        function drawCardToCanvas(canvas, side) {
            const ctx = canvas.getContext("2d");
            const data = getFormData();
            const theme = THEMES[currentTheme] || THEMES.green;

            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // 1080 x 1720 = 2x HD of 540 x 860 (CR80 Exact Ratio)
            ctx.scale(canvas.width / 540, canvas.height / 860);

            if (side === "front") {
                drawFrontCard(ctx, data, theme);
            } else {
                drawBackCard(ctx, data, theme);
            }
            ctx.restore();
        }

        function renderPreview() {
            const canvas = document.getElementById("cardCanvas");
            drawCardToCanvas(canvas, currentSide);
        }

        // ১০০% নির্ভরযোগ্য তাৎক্ষণিক HD ডাউনলোড ফাংশন
        function downloadCard(side) {
            switchSide(side);

            // এক্সপোর্টের জন্য আলাদা হাই-রেজোলিউশন ক্যানভাস (1080 x 1720 px, CR80 অনুপাত)
            const exportCanvas = document.createElement("canvas");
            exportCanvas.width = 1080;
            exportCanvas.height = 1720;
            drawCardToCanvas(exportCanvas, side);

            const data = getFormData();
            const safeName = data.name.replace(/[^\u0980-\u09FFa-zA-Z0-9]+/g, "_");
            const fileName = `ID_${side === "front" ? "Front" : "Back"}_${safeName}.png`;

            const readyBox = document.getElementById("downloadReadyBox");

            try {
                const dataUrl = exportCanvas.toDataURL("image/png", 1.0);

                // Blob URL তৈরি করে অটো-ডাউনলোড ট্রিগার
                const triggerDownload = (hrefUrl) => {
                    const a = document.createElement("a");
                    a.href = hrefUrl;
                    a.download = fileName;
                    a.style.display = "none";
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => {
                        if (a.parentNode) document.body.removeChild(a);
                    }, 300);
                };

                if (exportCanvas.toBlob) {
                    exportCanvas.toBlob((blob) => {
                        if (blob) {
                            if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
                            lastBlobUrl = URL.createObjectURL(blob);
                            triggerDownload(lastBlobUrl);
                            showReadyBox(lastBlobUrl, dataUrl, fileName, side);
                        } else {
                            triggerDownload(dataUrl);
                            showReadyBox(dataUrl, dataUrl, fileName, side);
                        }
                    }, "image/png", 1.0);
                } else {
                    triggerDownload(dataUrl);
                    showReadyBox(dataUrl, dataUrl, fileName, side);
                }
            } catch (err) {
                readyBox.style.display = "block";
                readyBox.innerHTML = `<p style="color:#b91c1c;">ডাউনলোডে সমস্যা হয়েছে: ${err.message}</p>`;
            }
        }

        function showReadyBox(dlHref, previewSrc, fileName, side) {
            const readyBox = document.getElementById("downloadReadyBox");
            readyBox.style.display = "block";
            readyBox.innerHTML = `
                <p><i class="fa-solid fa-circle-check"></i> ${side === "front" ? "ফ্রন্ট" : "ব্যাক"} সাইড HD কার্ড তৈরি হয়েছে (1080 × 1720 px)!</p>
                <a href="${dlHref}" download="${fileName}" class="manual-dl-link">
                    <i class="fa-solid fa-floppy-disk"></i> এখানে ট্যাপ করে ডাউনলোড করুন
                </a>
                <img src="${previewSrc}" alt="ID Card Preview" class="saved-img-preview">
                <p class="save-hint">মোবাইলে অটো-ডাউনলোড না হলে উপরের ছবিটির ওপর চেপে ধরে (Long Press) "Download image" দিন।</p>
            `;
            readyBox.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }

        // শুরুতেই ফন্ট, লোগো ও স্বাক্ষর লোড করে কার্ড রেন্ডার করা
        async function initApp() {
            renderPreview();

            try {
                await document.fonts.ready;
                renderPreview();
            } catch (e) {}

            const [loadedLogo, loadedSign] = await Promise.all([
                loadCorsImage(LOGO_URLS),
                loadCorsImage(SIGN_URLS)
            ]);

            if (loadedLogo) logoImg = loadedLogo;
            if (loadedSign) signImg = cleanSignatureBackground(loadedSign);

            renderPreview();
        }

        window.addEventListener("load", initApp);
    </script>
</body>
