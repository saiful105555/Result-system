<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Teacher ID Card</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Image Download Library (html2canvas) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans Bengali', sans-serif;
            background-color: #e4e9ed;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
            gap: 40px;
            flex-wrap: wrap;
        }

        /* Form Section */
        .form-section { background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 420px; }
        .form-section h2 { margin-bottom: 25px; text-align: center; color: #114B21; font-weight: 700; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #444; font-size: 15px; }
        .input-group input { width: 100%; padding: 12px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 15px; font-family: 'Noto Sans Bengali', sans-serif; transition: 0.3s; }
        .input-group input:focus { border-color: #114B21; outline: none; box-shadow: 0 0 8px rgba(17, 75, 33, 0.2); }
        .btn { width: 100%; padding: 14px; background-color: #114B21; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; box-shadow: 0 4px 10px rgba(17, 75, 33, 0.3); }
        .btn:hover { background-color: #0b3617; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(17, 75, 33, 0.4); }
        .btn-download { background-color: #1d70b8; box-shadow: 0 4px 10px rgba(29, 112, 184, 0.4); margin-top: 20px; }
        .btn-download:hover { background-color: #15558c; box-shadow: 0 6px 15px rgba(29, 112, 184, 0.5); }

        .preview-section { display: flex; flex-direction: column; align-items: center; }

        /* EXACT ID CARD DIMENSIONS & STYLING */
        .id-card-wrapper {
            width: 540px; 
            height: 860px; 
            background: linear-gradient(135deg, #ffffff 0%, #f4f7f5 80%, #e8f0eb 100%);
            position: relative; 
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2); 
            transform: scale(0.7); 
            transform-origin: top center;
            border-radius: 16px;
            border: 1px solid #dcdcdc;
        }

        /* Background Watermark */
        .id-card-wrapper::before {
            content: '';
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 350px;
            background-image: url('https://lh3.googleusercontent.com/d/1m5vaCV-l0bkI_P8i3Oq0XgvbgMUBKcR5');
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.05; /* Faint watermark */
            z-index: 1;
        }

        /* Curved Header */
        .card-header {
            background: linear-gradient(135deg, #0a3d19 0%, #176a2f 100%);
            height: 250px;
            border-bottom-left-radius: 50% 25px;
            border-bottom-right-radius: 50% 25px;
            text-align: center;
            padding-top: 25px;
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            border-bottom: 6px solid #c5a059; /* Elegant Gold Border */
            z-index: 2;
        }

        .header-logo {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: #fff;
            padding: 4px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 2px solid #c5a059;
        }

        .school-name-bn {
            color: #ffffff;
            font-family: 'Tiro Bangla', serif;
            font-size: 36px;
            font-weight: bold;
            line-height: 1.2;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.4);
        }

        .school-name-en {
            color: #E8D399; /* Soft Gold */
            font-family: 'Arial', sans-serif;
            font-size: 14.5px;
            font-weight: bold;
            letter-spacing: 1.5px;
            margin-top: 6px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        /* Photo Box */
        .photo-area {
            width: 190px;
            height: 230px;
            margin: -50px auto 0;
            border: 5px solid #ffffff;
            outline: 3px solid #c5a059; /* Double border effect */
            border-radius: 12px;
            overflow: hidden;
            background-color: #fff;
            position: relative;
            z-index: 3;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .photo-area img { width: 100%; height: 100%; object-fit: cover; }

        /* Name and Title */
        .title-area {
            text-align: center;
            margin-top: 20px;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }
        .title-area h1 { 
            font-size: 32px; 
            color: #0a3d19; 
            margin-bottom: 8px; 
            font-weight: 700; 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        /* Modern Designation Badge */
        .title-area h2 { 
            display: inline-block;
            font-size: 19px; 
            color: #fff; 
            font-weight: 600; 
            background: linear-gradient(135deg, #c5a059 0%, #a47c32 100%);
            padding: 6px 25px;
            border-radius: 30px;
            box-shadow: 0 4px 12px rgba(197, 160, 89, 0.4);
            letter-spacing: 0.5px;
        }

        .divider {
            width: 70%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #c5a059, transparent);
            margin: 20px auto 25px;
            opacity: 0.7;
        }

        /* Clean Aligned Details with Icons */
        .details-grid {
            display: grid;
            grid-template-columns: 30px 120px 15px 1fr;
            gap: 15px 5px;
            margin: 0 45px;
            font-size: 20px;
            font-weight: 600;
            color: #333;
            position: relative;
            z-index: 2;
            align-items: center;
        }
        .details-grid i { color: #176a2f; font-size: 18px; text-align: center; } /* Icons Color */
        .details-grid .label { color: #555; }
        .details-grid .colon { text-align: center; color: #777; }
        .details-grid .value { color: #111; font-weight: 700; }
        .blood-highlight { color: #d32f2f !important; font-weight: 700; }

        /* Footer (QR on Right, Signature on Left) */
        .card-footer {
            position: absolute;
            bottom: 25px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 45px;
            z-index: 2;
        }

        /* Large & Visible Signature */
        .signature-area {
            text-align: center;
            width: 260px;
        }
        .signature-area img {
            width: 250px; 
            height: 110px; 
            object-fit: contain;
            margin: 0 auto -20px auto; /* নেগেটিভ মার্জিন */
            display: block;
            mix-blend-mode: multiply; 
            filter: grayscale(100%) contrast(5) brightness(0.3); 
        }
        .signature-line {
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #222, #222, transparent);
            margin: 0 auto 5px auto;
        }
        .signature-area p {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            letter-spacing: 1px;
        }

        /* Right Side QR */
        .qr-area {
            width: 110px;
            height: 110px;
            background: #fff;
            padding: 6px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            border: 2px solid #e0e0e0;
        }
        .qr-area img { width: 100%; height: 100%; object-fit: contain; }

        @media (max-width: 900px) { body { flex-direction: column; align-items: center; } .id-card-wrapper { transform: scale(0.6); } }
    </style>
</head>
<body>

    <!-- Form Section -->
    <div class="form-section">
        <h2>শিক্ষক আইডি কার্ড জেনারেটর</h2>
        <form id="idForm">
            <div class="input-group">
                <label>নাম:</label>
                <input type="text" id="inpName" value="সাইফুল ইসলাম">
            </div>
            <div class="input-group">
                <label>পদবী:</label>
                <input type="text" id="inpDesig" value="সহকারী শিক্ষক">
            </div>
            <div class="input-group">
                <label>ডিপার্টমেন্ট:</label>
                <input type="text" id="inpDept" value="আইসিটি">
            </div>
            <div class="input-group">
                <label>শিফট:</label>
                <input type="text" id="inpShift" value="জবা">
            </div>
            <div class="input-group">
                <label>ফোন:</label>
                <input type="text" id="inpPhone" value="০১৬২২১৮৬৮১২">
            </div>
            <div class="input-group">
                <label>রক্তের গ্রুপ:</label>
                <input type="text" id="inpBlood" value="এ পজেটিভ">
            </div>
            <div class="input-group">
                <label>ছবি আপলোড করুন:</label>
                <input type="file" id="inpPhoto" accept="image/*">
            </div>
            <button type="button" class="btn" onclick="generateCard()">আপডেট করুন</button>
        </form>
    </div>

    <!-- Preview & Download Section -->
    <div class="preview-section">
        <div class="id-card-wrapper" id="idCard">

            <!-- Modern Header -->
            <div class="card-header">
                <img class="header-logo" src="https://lh3.googleusercontent.com/d/1m5vaCV-l0bkI_P8i3Oq0XgvbgMUBKcR5" onerror="this.src='https://drive.google.com/uc?export=view&id=1m5vaCV-l0bkI_P8i3Oq0XgvbgMUBKcR5';" crossorigin="anonymous" alt="Logo">
                <div class="school-name-bn">ইবনে তাইমিয়া স্কুল এন্ড কলেজ</div>
                <div class="school-name-en">IBN TAIMIYA SCHOOL & COLLEGE - EIIN NO:105751</div>
            </div>

            <!-- Teacher Photo -->
            <div class="photo-area">
                <img id="cardPhoto" src="https://via.placeholder.com/250x300?text=Upload+Photo" alt="Teacher">
            </div>

            <!-- Name and Title -->
            <div class="title-area">
                <h1 id="outName">সাইফুল ইসলাম</h1>
                <h2 id="outDesig">সহকারী শিক্ষক</h2>
            </div>

            <div class="divider"></div>

            <!-- Details Grid with Icons -->
            <div class="details-grid">
                <i class="fa-solid fa-building-user"></i>
                <div class="label">ডিপার্টমেন্ট</div><div class="colon">:</div><div class="value" id="outDept">আইসিটি</div>

                <i class="fa-solid fa-clock"></i>
                <div class="label">শিফট</div><div class="colon">:</div><div class="value" id="outShift">জবা</div>

                <i class="fa-solid fa-phone"></i>
                <div class="label">ফোন</div><div class="colon">:</div><div class="value" id="outPhone">০১৬২২১৮৬৮১২</div>

                <i class="fa-solid fa-droplet" style="color: #d32f2f;"></i>
                <div class="label">রক্তের গ্রুপ</div><div class="colon">:</div><div class="value blood-highlight" id="outBlood">এ পজেটিভ</div>
            </div>

            <!-- Footer Section -->
            <div class="card-footer">
                <!-- Signature Area -->
                <div class="signature-area">
                    <img src="https://lh3.googleusercontent.com/d/1ci3Kr42iV1rU-NjKFiUDfuFIR0KZK44c" onerror="this.src='https://drive.google.com/uc?export=view&id=1ci3Kr42iV1rU-NjKFiUDfuFIR0KZK44c';" crossorigin="anonymous" alt="Signature">
                    <div class="signature-line"></div>
                    <p>অধ্যক্ষ</p>
                </div>

                <!-- QR Code -->
                <div class="qr-area">
                    <img id="qrCodeImg" src="" alt="QR Code" crossorigin="anonymous">
                </div>
            </div>

        </div>

        <button type="button" class="btn btn-download" onclick="downloadImage()">HD ছবি ডাউনলোড করুন</button>
    </div>

    <script>
        // Update data function
        function generateCard() {
            const name = document.getElementById('inpName').value;
            const desig = document.getElementById('inpDesig').value;
            const dept = document.getElementById('inpDept').value;
            const shift = document.getElementById('inpShift').value;
            const phone = document.getElementById('inpPhone').value;
            const blood = document.getElementById('inpBlood').value;
            const photoInput = document.getElementById('inpPhoto');

            document.getElementById('outName').innerText = name;
            document.getElementById('outDesig').innerText = desig;
            document.getElementById('outDept').innerText = dept;
            document.getElementById('outShift').innerText = shift;
            document.getElementById('outPhone').innerText = phone;
            document.getElementById('outBlood').innerText = blood;

            if (photoInput.files && photoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('cardPhoto').src = e.target.result;
                }
                reader.readAsDataURL(photoInput.files[0]);
            }

            // Generate QR Code
            const qrData = `নাম: ${name}\nপদবী: ${desig}\nফোন: ${phone}\nরক্তের গ্রুপ: ${blood}`;
            const qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=150x150&margin=1&data=" + encodeURIComponent(qrData);
            document.getElementById('qrCodeImg').src = qrUrl;
        }

        window.onload = () => {
            generateCard();
        };

        // Download High-Quality HD Image (PNG)
        function downloadImage() {
            const element = document.getElementById('idCard');

            // Temporary scale reset for perfect high-quality capture
            element.style.transform = 'scale(1)'; 

            html2canvas(element, {
                scale: 4, // 4x scale for super HD quality
                useCORS: true,
                allowTaint: true,
                backgroundColor: '#ffffff'
            }).then(canvas => {
                // Create a download link for the image
                const link = document.createElement('a');
                link.download = 'Teacher_ID_Card.png';
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();

                // Revert scale back for web preview based on screen size
                element.style.transform = window.innerWidth <= 900 ? 'scale(0.6)' : 'scale(0.7)';
            });
        }
    </script>
</body>
</html>
